backend:
  name: github
  repo: TITADE/pdfblueprints
  branch: main
  base_url: https://pdfblueprints-cms-oauth.edward-luf.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: products
    label: Products
    files:
      - name: products
        label: Product listings
        file: data/products.json
        fields:
          - label: Products
            name: products
            widget: list
            summary: "{{fields.title}} — {{fields.currency}}{{fields.price}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "Handle (URL slug)", name: handle, widget: string, hint: "Must be unique, no slashes or URLs — just a slug, e.g. my-guide-title. Used in the product URL, e.g. /products/<handle>/"}
              - {label: Category, name: category, widget: string}
              - {label: Price, name: price, widget: number, value_type: float}
              - {label: Currency, name: currency, widget: select, options: ["GBP", "USD", "EUR"], default: GBP}
              - {label: "Cover image", name: image, widget: image}
              - {label: "Description (plain text only — no HTML tags, they will show up literally on the page)", name: description, widget: text}
              - {label: "Payhip checkout URL", name: payhipUrl, widget: string, hint: "Copy from Payhip: Products > this product > Share/checkout link. Confirm the price above matches Payhip before publishing."}
              - {label: "Source (internal note)", name: source, widget: string, required: false}
              - {label: "Original title (internal note)", name: originalTitle, widget: string, required: false}
              - label: Tags
                name: tags
                widget: list
                required: false
                field: {label: Tag, name: tag, widget: string}
              - {label: "I confirm this price matches the live Payhip checkout price", name: priceConfirmed, widget: boolean, default: false, required: false}

  - name: previews
    label: "Sample pages & page counts"
    files:
      - name: previews
        label: "Product sample pages"
        file: data/previews.json
        fields:
          - label: Previews
            name: previews
            widget: list
            summary: "{{fields.handle}}"
            fields:
              - {label: "Product handle", name: handle, widget: string, hint: "Must exactly match a product's Handle field."}
              - {label: "Total page count", name: pageCount, widget: number, value_type: int}
              - {label: "Number of PDF files", name: fileCount, widget: number, value_type: int, default: 1}
              - label: "Sample pages (2 recommended)"
                name: samples
                widget: list
                required: false
                fields:
                  - {label: "Sample image", name: src, widget: image}
                  - {label: "Label (shown on the button)", name: label, widget: string, hint: "e.g. Sample page 3"}
                  - {label: "Alt text", name: alt, widget: string}

  - name: blog
    label: "Blog posts"
    files:
      - name: posts
        label: "Guides blog posts"
        file: data/posts.json
        fields:
          - label: Posts
            name: posts
            widget: list
            add_to_top: true
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "Slug (URL)", name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only, e.g. my-post-title"], hint: "Used in the post URL, e.g. /blogs/guides/<slug>/ . Must be unique. Do not change it after publishing."}
              - {label: "Excerpt (about 150 characters)", name: excerpt, widget: text, hint: "Shown on the journal card and used as the page's meta description for Google."}
              - {label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Display date only. The post goes live as soon as you publish."}
              - {label: Author, name: author, widget: string, default: "Edward Lufadeju"}
              - {label: "Body (write HTML: <p>, <h2>, <a href>, <ul>)", name: html, widget: text, hint: "Plain HTML, not markdown. Example: <p>Paragraph</p><h2>Heading</h2>. Product links: /products/<handle>/"}

  - name: collections_page
    label: "Curated collections"
    files:
      - name: collections
        label: "Collections (e.g. Best Sellers)"
        file: data/collections.json
        fields:
          - label: Collections
            name: collections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "Slug (URL)", name: slug, widget: string}
              - label: "Product handles included"
                name: handles
                widget: list
                hint: "Must exactly match a product's Handle field"
                field: {label: Handle, name: handle, widget: string}

  - name: store_pages
    label: "Store pages"
    files:
      - name: pages
        label: "Static pages (contact, etc.)"
        file: data/store-pages.json
        fields:
          - label: Pages
            name: pages
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Path, name: path, widget: string, hint: "e.g. pages/contact/"}
              - {label: "Body (HTML)", name: html, widget: markdown}

  - name: policies
    label: Policies
    files:
      - name: policies
        label: "Policy pages"
        file: data/policies.json
        fields:
          - label: "Approved for production launch"
            name: approvedForLaunch
            widget: boolean
            hint: "Must be true for the live site to index and show final policies. Only the site owner should toggle this."
          - label: "Review notes (internal, not published)"
            name: reviewNotes
            widget: list
            required: false
            field: {label: Note, name: note, widget: string}
          - label: "Policy pages"
            name: pages
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "Slug (URL)", name: slug, widget: string}
              - {label: "Body (HTML)", name: html, widget: markdown}
